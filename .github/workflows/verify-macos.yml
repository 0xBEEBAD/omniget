name: Verify macOS Migration & Cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-macos.yml'

jobs:
  verify-macos:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage simulated legacy OmniGet environment
        run: |
          set -e
          echo "=== 1. Starting dummy OmniGet background process ==="
          cp /bin/sleep ./OmniGet
          ./OmniGet 300 &
          sleep 1
          OMNI_PID=$(pgrep -x OmniGet)
          echo "OmniGet running with PID: $OMNI_PID"

          echo "=== 2. Creating legacy app bundles ==="
          sudo mkdir -p /Applications/OmniGet.app/Contents/MacOS
          sudo touch /Applications/OmniGet.app/Contents/MacOS/OmniGet
          sudo touch /Applications/OmniGet.app/Contents/Info.plist
          sudo chown -R $(whoami):admin /Applications/OmniGet.app

          mkdir -p "$HOME/Applications/OmniGet.app/Contents/MacOS"
          touch "$HOME/Applications/OmniGet.app/Contents/MacOS/OmniGet"

          echo "=== 3. Creating legacy user data ==="
          LEGACY_DATA="$HOME/Library/Application Support/com.openselena.omniget"
          mkdir -p "$LEGACY_DATA/cookies"
          echo "LEGACY_SQLITE_MOCK_DATA" > "$LEGACY_DATA/omniget.db"
          echo '{"theme":"dark"}' > "$LEGACY_DATA/settings.json"
          echo "cookie_data" > "$LEGACY_DATA/cookies/auth.txt"

          echo "Setup complete. Verifying initial state:"
          test -d /Applications/OmniGet.app && echo "/Applications/OmniGet.app exists"
          test -d "$HOME/Applications/OmniGet.app" && echo "$HOME/Applications/OmniGet.app exists"
          test -f "$LEGACY_DATA/omniget.db" && echo "Legacy DB exists"

      - name: Download LibreGet v0.16.10 binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Downloading LibreGet_0.16.10_aarch64.app.tar.gz from release assets..."
          gh release download v0.16.10 -p "*aarch64.app.tar.gz" --repo OpenSelena/libreget
          tar -xzf LibreGet_*.app.tar.gz
          xattr -cr LibreGet.app || true
          ls -ld LibreGet.app

      - name: Run LibreGet startup cycle
        run: |
          echo "Launching LibreGet to trigger process kill, migration, and POSIX cleanup..."
          ./LibreGet.app/Contents/MacOS/libreget &
          LIBRE_PID=$!
          echo "LibreGet launched with PID $LIBRE_PID"
          sleep 5
          kill -9 $LIBRE_PID 2>/dev/null || true
          echo "LibreGet execution cycle completed."

      - name: Assert macOS cleanup and migration
        run: |
          set -e
          echo "=========================================="
          echo "       VERIFYING MACOS ASSERTIONS        "
          echo "=========================================="

          FAIL=0

          # 1. Process termination
          if pgrep -x OmniGet; then
            echo "❌ FAIL: OmniGet process was NOT killed!"
            FAIL=1
          else
            echo "✅ PASS: OmniGet process was cleanly killed by pkill."
          fi

          # 2. Root /Applications bundle removal
          if [ -d "/Applications/OmniGet.app" ]; then
            echo "❌ FAIL: /Applications/OmniGet.app was NOT removed!"
            ls -la /Applications/OmniGet.app
            FAIL=1
          else
            echo "✅ PASS: /Applications/OmniGet.app was completely removed."
          fi

          # 3. User ~/Applications bundle removal
          if [ -d "$HOME/Applications/OmniGet.app" ]; then
            echo "❌ FAIL: $HOME/Applications/OmniGet.app was NOT removed!"
            ls -la "$HOME/Applications/OmniGet.app"
            FAIL=1
          else
            echo "✅ PASS: $HOME/Applications/OmniGet.app was completely removed."
          fi

          # 4. Data migration
          TARGET_DATA="$HOME/Library/Application Support/com.openselena.libreget"
          if [ -f "$TARGET_DATA/libreget.db" ]; then
            echo "✅ PASS: Legacy database successfully migrated to libreget.db."
          else
            echo "❌ FAIL: libreget.db not found in $TARGET_DATA!"
            ls -la "$TARGET_DATA" || true
            FAIL=1
          fi

          if [ -f "$TARGET_DATA/settings.json" ]; then
            echo "✅ PASS: settings.json successfully migrated."
          else
            echo "❌ FAIL: settings.json was not migrated!"
            FAIL=1
          fi

          if [ -f "$TARGET_DATA/cookies/auth.txt" ]; then
            echo "✅ PASS: cookies/auth.txt successfully migrated."
          else
            echo "❌ FAIL: cookies directory was not migrated!"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "=========================================="
            echo "❌ MACOS VERIFICATION FAILED"
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "✅ ALL MACOS VERIFICATION CHECKS PASSED!"
          echo "=========================================="
